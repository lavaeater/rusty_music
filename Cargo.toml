[workspace]
members = ["macros"]

[workspace.package]
edition = "2024"
authors = ["Tommie Nygren"]
documentation = "README.md"
readme = "README.md"
description = "A music generation plugin for bevy"
homepage = "https://github.com/lavaeater/rusty_music"
repository = "https://github.com/lavaeater/rusty_music"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "audio", "gamedev"]
categories = ["game-development", "multimedia::audio"]

[package]
name = "rusty_music"
version = "0.3.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
    "bevy_asset",
] }
bevy_seedling = { version = "0.8.0", default-features = false, features = ["wav"] }
rand = "0.10.1"
bevy-rusty-music-macros = { version="0.1.0", path = "macros" }
tunes = { version="1.1.0", optional = true }

[dev-dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
    "2d_bevy_render",
    "default_app",
    "picking",
    "ui_bevy_render",
    "bevy_winit",
    "default_font",
    "std",
    "sysinfo_plugin",
    "wayland",
    "webgl2",
    "x11",
] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[features]
default = []
tunes_audio = ["tunes"]

[profile.dev.package."*"]
opt-level = 3

[[example]]
name = "simple"
path = "examples/simple.rs"

[[example]]
name = "custom_instrument"
path = "examples/custom_instrument.rs"

[[example]]
name = "full_band"
path = "examples/full_band.rs"

[[example]]
name = "time_signatures"
path = "examples/time_signatures.rs"

[[example]]
name = "epic_orchestra"
path = "examples/epic_orchestra.rs"

[[example]]
name = "bevy_integration"
path = "examples/bevy_integration.rs"

[[example]]
name = "music_machine"
path = "examples/music_machine.rs"


# bevy_seedling has no crates.io release targeting Bevy 0.19; its `master` (0.8.0) does.
# Kept in sync with the same patch in the parent aliens-vs-suburbia manifest.
[patch.crates-io]
bevy_seedling = { git = "https://github.com/corvusprudens/bevy_seedling", rev = "9db62d12daa11a2ffbd9da1565154127eac0a241" }
