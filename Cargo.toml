[workspace]
members = ["macros"]

[workspace.package]
edition = "2024"
authors = ["Tommie Nygren"]
documentation = "README.md"
readme = "README.md"
description = "A music generation plugin for bevy"
homepage = "https://github.com/lavaeater/rusty_music"
repository = "https://github.com/lavaeater/rusty_music"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "audio", "gamedev"]
categories = ["game-development", "multimedia::audio"]

[package]
name = "rusty_music"
version = "0.4.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "bevy_asset",
] }
bevy_seedling = { version = "0.8.0", default-features = false, features = ["wav", "cpal", "effects"] }
rand = "0.10.1"
bevy-rusty-music-macros = { version="0.1.0", path = "macros" }
glicol_synth = { git = "https://github.com/lavaeater/glicol", branch = "main", optional = true }
glicol_parser = { git = "https://github.com/lavaeater/glicol", branch = "main", optional = true }
# Must match glicol_synth's: its graph hands out petgraph 0.6 node indices.
petgraph = { version = "0.6", default-features = false, features = ["stable_graph"], optional = true }
# Must match glicol_synth's hashbrown: its `Node` trait takes a hashbrown map.
hashbrown = { version = "0.14", optional = true }
# The same Firewheel as bevy_seedling (0.12, patched below for Bevy 0.20); needed by name
# for its `Diff`/`Patch` derives.
firewheel = { version = "0.12", default-features = false }

[dev-dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "2d_bevy_render",
    "default_app",
    "picking",
    "ui_bevy_render",
    "bevy_winit",
    "default_font",
    "file_watcher",
    "std",
    "sysinfo_plugin",
    "wayland",
    "webgl2",
    "x11",
] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[features]
default = []
synth = ["dep:glicol_synth", "dep:glicol_parser", "dep:hashbrown", "dep:petgraph"]

[profile.dev.package."*"]
opt-level = 3

[[example]]
name = "simple"
path = "examples/simple.rs"

[[example]]
name = "custom_instrument"
path = "examples/custom_instrument.rs"

[[example]]
name = "full_band"
path = "examples/full_band.rs"

[[example]]
name = "time_signatures"
path = "examples/time_signatures.rs"

[[example]]
name = "epic_orchestra"
path = "examples/epic_orchestra.rs"

[[example]]
name = "real_orchestra"
path = "examples/real_orchestra.rs"

[[example]]
name = "bevy_integration"
path = "examples/bevy_integration.rs"

[[example]]
name = "music_machine"
path = "examples/music_machine.rs"

[[example]]
name = "sample_browser"
path = "examples/sample_browser.rs"


# bevy_seedling has no crates.io release targeting Bevy 0.20; our fork's `bevy-0.20` branch
# does. Kept in sync with the same patch in the parent aliens-vs-suburbia manifest.
[patch.crates-io]
bevy_seedling = { git = "https://github.com/lavaeater/bevy_seedling", rev = "519c25bad4d7a36148136666f32499cececdd33b" }
# Firewheel 0.12 with its Bevy dependency bumped to 0.20 (and a `glam-33` feature), which the
# seedling fork needs. It lives in the game repo, next to this submodule:
# `../vendor/firewheel-bevy-0.20` (see its README). Remove once upstream supports Bevy 0.20.
firewheel-core = { path = "../vendor/firewheel-bevy-0.20/firewheel-core" }
firewheel-graph = { path = "../vendor/firewheel-bevy-0.20/firewheel-graph" }
firewheel-nodes = { path = "../vendor/firewheel-bevy-0.20/firewheel-nodes" }
firewheel-cpal = { path = "../vendor/firewheel-bevy-0.20/firewheel-cpal" }
firewheel-rtaudio = { path = "../vendor/firewheel-bevy-0.20/firewheel-rtaudio" }
firewheel-symphonium = { path = "../vendor/firewheel-bevy-0.20/firewheel-symphonium" }
firewheel-macros = { path = "../vendor/firewheel-bevy-0.20/firewheel-macros" }
firewheel = { path = "../vendor/firewheel-bevy-0.20/firewheel" }

[[example]]
name = "improv_orchestra"
path = "examples/improv_orchestra.rs"

[[example]]
name = "synth_spike"
path = "examples/synth_spike.rs"
required-features = ["synth"]

[[example]]
name = "synth_band"
path = "examples/synth_band.rs"
required-features = ["synth"]

[[example]]
name = "synth_presets"
path = "examples/synth_presets.rs"
required-features = ["synth"]

[[example]]
name = "synth_game"
path = "examples/synth_game.rs"
required-features = ["synth"]

[[example]]
name = "synth_live"
path = "examples/synth_live.rs"
required-features = ["synth"]
